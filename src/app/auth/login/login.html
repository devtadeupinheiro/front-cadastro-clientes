<div class="login-wrapper">
  <h2>Acesso ao Sistema</h2>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="email">E-mail</label>
      <input 
        id="email" 
        type="email" 
        formControlName="email" 
        placeholder="Digite seu e-mail"
      >
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <small>E-mail inválido.</small>
      }
    </div>
    
    <div class="form-group">
      <label for="passwordUser">Senha</label>
      <input 
        id="passwordUser" 
        type="password" 
        formControlName="passwordUser" 
        placeholder="Digite sua senha"
      >
      @if (loginForm.get('passwordUser')?.invalid && loginForm.get('passwordUser')?.touched) {
        <small>A senha é obrigatória.</small>
      }
    </div>

    <!-- Leitura do Signal com parênteses () -->
    @if (errorMessage()) {
      <div style="color: red; margin-top: 10px;">
        {{ errorMessage() }}
      </div>
    }
    
    <button type="submit" [disabled]="loginForm.invalid" style="margin-top: 15px;">
      Entrar
    </button>
    
  </form>
</div>
